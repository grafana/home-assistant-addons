name: Lint

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 0 * * *"

jobs:
  find:
    name: Find add-ons
    runs-on: ubuntu-latest
    outputs:
      addons: ${{ steps.addons.outputs.addons_list }}
    steps:
      - name: Check out code from GitHub
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Find add-on directories
        id: addons
        uses: home-assistant/actions/helpers/find-addons@a7c616ce81ccda50150bf1595786c71b1883fabb # master

  lint:
    name: Lint add-on ${{ matrix.path }}
    runs-on: ubuntu-latest
    needs: find
    strategy:
      matrix:
        path: ${{ fromJson(needs.find.outputs.addons) }}
    steps:
      - name: Check out code from GitHub
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Run Home Assistant Add-on Lint
        uses: frenck/action-addon-linter@b9cfd1bc62ba60d2c4fc96317b5f7ada5923f4a7 # v2.21.1
        with:
          path: "./${{ matrix.path }}"

  alloy:
    name: Validate Alloy config ${{ matrix.path }}
    runs-on: ubuntu-latest
    needs: find
    strategy:
      matrix:
        path: ${{ fromJson(needs.find.outputs.addons) }}
    steps:
      - name: Check out code from GitHub
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Validate Alloy config
        env:
          ADDON: ${{ matrix.path }}
        run: |
          config="${ADDON}/rootfs/config.alloy"
          if [[ ! -f "${config}" ]]; then
            echo "No Alloy config for ${ADDON}, nothing to validate"
            exit 0
          fi

          version=$(sed -n 's/^ARG ALLOY_VERSION="\(.*\)"$/\1/p' "${ADDON}/Dockerfile")
          if [[ -z "${version}" ]]; then
            echo "::error file=${ADDON}/Dockerfile::Could not determine ALLOY_VERSION"
            exit 1
          fi

          echo "Validating ${config} against Alloy ${version}"
          docker run --rm -v "${PWD}/${config}:/config.alloy:ro" \
            "grafana/alloy:${version}" validate /config.alloy
